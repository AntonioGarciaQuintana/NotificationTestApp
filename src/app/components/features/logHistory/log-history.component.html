<mat-card class="history-card">

  <mat-card-title>Log History</mat-card-title>
  <div class="table-container">
    <table mat-table [dataSource]="logs" class="mat-elevation-z1">

      <!-- User -->
      <ng-container matColumnDef="User">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let log">
          {{ log.userName }}
        </td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="Email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let log">
          {{ log.userEmail }}
        </td>
      </ng-container>

      <!-- Type -->
      <ng-container matColumnDef="Notification type">
        <th mat-header-cell *matHeaderCellDef>Notification type</th>
        <td mat-cell *matCellDef="let log">
          {{ log.typeCode }}
        </td>
      </ng-container>

      <!-- Category -->
      <ng-container matColumnDef="Category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let log">
          <span class="badge" [ngClass]="log.categoryCode">
            {{ log.categoryCode }}
          </span>
        </td>
      </ng-container>

      <!-- Message -->
      <ng-container matColumnDef="Message">
        <th mat-header-cell *matHeaderCellDef>Message</th>
        <td mat-cell *matCellDef="let log">
          {{ log.message }}
        </td>
      </ng-container>

      <!-- Date -->
      <ng-container matColumnDef="Date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let log">
          {{ log.timestamp | date:'short' }}
        </td>
      </ng-container>

      <!-- Delivered -->
      <ng-container matColumnDef="Delivered">
        <th mat-header-cell *matHeaderCellDef>Delivered ?</th>
        <td mat-cell *matCellDef="let log">
          <span class="status-badge" [ngClass]="log.delivered ? 'delivered' : 'not-delivered'">
            {{ log.delivered ? 'YES' : 'NO' }}
          </span>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>
</mat-card>
