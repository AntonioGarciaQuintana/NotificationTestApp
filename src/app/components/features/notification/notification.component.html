<mat-card class="form-card">

  <mat-card-title>Send Notification</mat-card-title>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option *ngFor="let c of categories" [value]="c.code">
            {{ c.code }}
          </mat-option>
        </mat-select>
        <mat-error>Category is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Message</mat-label>
        <textarea matInput rows="4" maxlength="500" formControlName="message">
        </textarea>
        <mat-error>Message cannot be empty</mat-error>
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
          Send
        </button>
      </div>

    </form>
  </mat-card-content>

</mat-card>
